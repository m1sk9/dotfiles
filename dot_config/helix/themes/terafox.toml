# Why not bundled: Helix ships nightfox only, not terafox.
# Why inherit: nightfox's scope mapping is reused; only the palette is swapped.
inherits = "nightfox"

[palette]
red            = "#e85c51"
green          = "#7aa4a1"
yellow         = "#fda47f"
blue           = "#5a93aa"
magenta        = "#ad5c7c"
cyan           = "#a1cdd8"
orange         = "#ff8349"
pink           = "#cb7985"
comment        = "#6d7f8b"
bg0            = "#0f1c1e"
bg1            = "#152528"
bg2            = "#1d3337"
bg3            = "#254147"
fg1            = "#e6eaea"
fg3            = "#587b7b"
sel0           = "#293e40"
sel1           = "#425e5e"
