onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
new_cwd = "home"

[worktrees]
directory = "~/Repositories/claude.ai"

[remote]
manage_ssh_config = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[ui]
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"
mouse_scroll_lines = 3
agent_panel_sort = "priority"

# Why: command は macOS/Linux では `/bin/sh -lc` 固定で実行され，default_shell の
# fish は使われない．そのため各 command は fish ではなく POSIX sh 互換 (awk/grep) で
# 書く．出力は最終行のみが採用され ESC シーケンスは除去される仕様なので，各コマンドは
# 1 行だけ出力するようにしている．
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "command", command = "echo \"🔋$(pmset -g batt | grep -Eo '[0-9]+%' | head -1)\"", interval_seconds = 60, timeout_seconds = 3 },
  { type = "command", command = "top -l 1 -n 0 | awk '/CPU usage/{gsub(\"%\",\"\",$7); printf \"⚙️%.0f%%\\n\", 100-$7}'", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "top -l 1 -n 0 | awk '/PhysMem/{print \"🧮\"$2}'", interval_seconds = 10, timeout_seconds = 3 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " │ "

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# Why not 既定の [["state_icon", "workspace", "tab"], ["agent"]]: tab はタブ番号
# ("1") しか出さず，agent は全行 "claude" になるので，どのセッションが何をして
# いるのか一覧から読めない．Claude Code は会話の要約をターミナルタイトルに書く
# ので，それを主役に据える．
#
# Why not 行の既定スタイルに任せる: 既定では 2 行目が沈んで背景に埋もれる．
# 読ませたいのは要約なので terafox の fg0 で白を明示し，workspace は
# terafox の fg3 に落として添える．
[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "terminal_title_stripped", fg = "#eaeeee" }],
    [{ token = "workspace", fg = "#587b7b" }, "tab"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[experimental]
pane_history = false

[theme]
name = "gruvbox"
auto_switch = false

# Why: Ghostty (theme = Terafox) / nvim (colorscheme = terafox) に配色を揃える．
# herdr の組み込みテーマに terafox はないため，base は gruvbox のまま
# theme.custom で全トークンを terafox 公式パレット
# (https://github.com/EdenEast/nightfox.nvim/blob/main/lua/nightfox/palette/terafox.lua)
# の値に上書きする．
[theme.custom]
accent = "#73a3b7"        # blue.bright
panel_bg = "#152528"      # bg1
# Why not bg0: Ghostty の Terafox テーマは background に bg1 (#152528) を使っており，
# サイドバーだけ bg0 にすると境目の色差がくっきり出てしまう
sidebar_bg = "#152528"    # bg1
active_row_bg = "#293e40" # sel0
selection_bg = "#425e5e"  # sel1
surface0 = "#1d3337"      # bg2
surface1 = "#254147"      # bg3
surface_dim = "#0f1c1e"   # bg0
overlay0 = "#2d4f56"      # bg4
overlay1 = "#587b7b"      # fg3
text = "#e6eaea"          # fg1
subtext0 = "#cbd9d8"      # fg2
mauve = "#ad5c7c"         # magenta.base
green = "#7aa4a1"         # green.base
yellow = "#fda47f"        # yellow.base
red = "#e85c51"           # red.base
blue = "#5a93aa"          # blue.base
teal = "#a1cdd8"          # cyan.base
peach = "#ff8349"         # orange.base

[keys]
switch_tab = "cmd+1..9"
next_agent = "cmd+j"
previous_agent = "cmd+k"
next_workspace = "ctrl+cmd+j"
previous_workspace = "ctrl+cmd+k"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
# Why not lazygit を直接: バイナリ直起動だと herdr server の PATH しか継承せず，
# mise shims (pnpm 等) が通らず .husky/pre-commit が pnpm: command not found になる
command = "/opt/homebrew/bin/fish -c /opt/homebrew/bin/lazygit"
description = "run lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
# Why: popup はコマンドが exit するまで全入力 (Escape 含む) がそのまま子プロセスへ
# 渡り，herdr 側にポップアップを閉じる機構が無い．popup コマンドには
# HERDR_PANE_ID も渡らない (HERDR_ACTIVE_PANE_ID は背後の通常ペインの ID で別物)
# ので herdr pane close は使えない．ただのシェルには自前の quit キーが無く exit
# を打つしかなくなるので，F1 に exit を割り当てる．F1 は fish 既定でも
# Ghostty 既定でも未使用
command = "/opt/homebrew/bin/fish -C 'bind f1 exit'"
description = "scratch shell"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+z"
type = "shell"
command = "/opt/homebrew/bin/zed $HERDR_ACTIVE_PANE_CWD"
description = "open in zed"

[[keys.command]]
key = "prefix+ctrl+h"
type = "popup"
command = "/opt/homebrew/bin/hunk diff"
description = "open hunk"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "popup"
# Why fish -c: strays が内部で claude を spawn するが，claude は
# ~/.local/bin (fish_user_paths 経由) にあり，herdr server 自体の PATH には
# 含まれない．バイナリ直起動だと "failed to spawn claude: No such file or
# directory" になるため，lazygit と同じ理由で fish 経由にする
command = "/opt/homebrew/bin/fish -c /opt/homebrew/bin/strays"
description = "open strays"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage herdr plugins"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+ctrl+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
