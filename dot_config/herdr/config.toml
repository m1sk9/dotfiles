onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
switch_tab = "cmd+1..9"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
# Why not lazygit を直接: バイナリ直起動だと herdr server の PATH しか継承せず，
# mise shims (pnpm 等) が通らず .husky/pre-commit が pnpm: command not found になる
command = "/opt/homebrew/bin/fish -c /opt/homebrew/bin/lazygit"
description = "run lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "/opt/homebrew/bin/fish"
description = "scratch shell"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+z"
type = "shell"
command = "/opt/homebrew/bin/zed $HERDR_ACTIVE_PANE_CWD"
description = "open in zed"

[[keys.command]]
key = "prefix+ctrl+h"
type = "popup"
command = "/opt/homebrew/bin/hunk diff"
description = "open hunk"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage herdr plugins"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+ctrl+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[worktrees]
directory = "~/Repositories/claude.ai"

[ui]
mouse_scroll_lines = 3
agent_panel_sort = "priority"

# Why not 既定の [["state_icon", "workspace", "tab"], ["agent"]]: tab はタブ番号
# ("1") しか出さず，agent は全行 "claude" になるので，どのセッションが何をして
# いるのか一覧から読めない．Claude Code は会話の要約をターミナルタイトルに書く
# ので，それを主役に据える．
#
# Why not 行の既定スタイルに任せる: 既定では 2 行目が沈んで gruvbox の背景に
# 埋もれる．読ませたいのは要約なので白を明示し，workspace は gruvbox の fg4 に
# 落として添える．
[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "terminal_title_stripped", fg = "#ffffff" }],
    [{ token = "workspace", fg = "#a89984" }, "tab"],
]

[experimental]
pane_history = false

[theme]
name = "gruvbox"
auto_switch = false
