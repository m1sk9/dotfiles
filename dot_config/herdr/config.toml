onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
switch_tab = "cmd+1..9"
next_agent = "cmd+j"
previous_agent = "cmd+k"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
# Why not lazygit を直接: バイナリ直起動だと herdr server の PATH しか継承せず，
# mise shims (pnpm 等) が通らず .husky/pre-commit が pnpm: command not found になる
command = "/opt/homebrew/bin/fish -c /opt/homebrew/bin/lazygit"
description = "run lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
# Why: popup はコマンドが exit するまで全入力 (Escape 含む) がそのまま子プロセスへ
# 渡り，herdr 側にポップアップを閉じる機構が無い．popup コマンドには
# HERDR_PANE_ID も渡らない (HERDR_ACTIVE_PANE_ID は背後の通常ペインの ID で別物)
# ので herdr pane close は使えない．ただのシェルには自前の quit キーが無く exit
# を打つしかなくなるので，F1 に exit を割り当てる．F1 は fish 既定でも
# Ghostty 既定でも未使用
command = "/opt/homebrew/bin/fish -C 'bind f1 exit'"
description = "scratch shell"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+z"
type = "shell"
command = "/opt/homebrew/bin/zed $HERDR_ACTIVE_PANE_CWD"
description = "open in zed"

[[keys.command]]
key = "prefix+ctrl+h"
type = "popup"
command = "/opt/homebrew/bin/hunk diff"
description = "open hunk"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "popup"
# Why fish -c: strays が内部で claude を spawn するが，claude は
# ~/.local/bin (fish_user_paths 経由) にあり，herdr server 自体の PATH には
# 含まれない．バイナリ直起動だと "failed to spawn claude: No such file or
# directory" になるため，lazygit と同じ理由で fish 経由にする
command = "/opt/homebrew/bin/fish -c /opt/homebrew/bin/strays"
description = "open strays"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+ctrl+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage herdr plugins"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+ctrl+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[worktrees]
directory = "~/Repositories/claude.ai"

[ui]
mouse_scroll_lines = 3
agent_panel_sort = "priority"

# Why not 既定の [["state_icon", "workspace", "tab"], ["agent"]]: tab はタブ番号
# ("1") しか出さず，agent は全行 "claude" になるので，どのセッションが何をして
# いるのか一覧から読めない．Claude Code は会話の要約をターミナルタイトルに書く
# ので，それを主役に据える．
#
# Why not 行の既定スタイルに任せる: 既定では 2 行目が沈んで gruvbox の背景に
# 埋もれる．読ませたいのは要約なので白を明示し，workspace は gruvbox の fg4 に
# 落として添える．
[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "terminal_title_stripped", fg = "#ffffff" }],
    [{ token = "workspace", fg = "#a89984" }, "tab"],
]

[experimental]
pane_history = false

[theme]
name = "gruvbox"
auto_switch = false
