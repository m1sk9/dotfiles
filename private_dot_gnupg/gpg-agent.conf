pinentry-program /opt/homebrew/bin/pinentry-mac
default-cache-ttl 43200
max-cache-ttl 43200
# Why not default-cache-ttl だけで足りるか: あちらは gpg 経路 (commit / tag 署名)
# 専用で，ssh-agent emulation 経由の PIN は *-ttl-ssh が別管理する．未指定だと
# 既定の 1800 / 7200 が効き，push / pull で 2 時間ごとに PIN 入力が発生する．
default-cache-ttl-ssh 43200
max-cache-ttl-ssh 43200
